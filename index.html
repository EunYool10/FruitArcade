<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5e6" />
    <title>상큼 과일 아케이드 존</title>
    <meta name="description" content="과일 메모리, 수박 게임, FRUIT DASH — 오늘의 미션과 업적에 도전하는 상큼한 과일 아케이드" />
    <meta property="og:title" content="상큼 과일 아케이드 존" />
    <meta property="og:description" content="과일 메모리, 수박 게임, FRUIT DASH — 오늘의 미션과 업적에 도전하는 상큼한 과일 아케이드" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FRUIT ARCADE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light
      try {
        var saved = JSON.parse(localStorage.getItem('fruit_arcade_settings') || '{}').theme || 'light';
        var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
